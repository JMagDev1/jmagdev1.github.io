<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Project - Jack Maguire Portfolio</title>
    <link rel="stylesheet" href="../css/project-page.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../images/PicForBar.png">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="nav-logo">
                <span class="logo-symbol">&lt;/&gt;</span>
                <span>Jack Maguire</span>
            </a>
            <div class="nav-menu">
                <a href="../index.html#home" class="nav-link">Home</a>
                <a href="../index.html#about" class="nav-link">About</a>
                <a href="../index.html#projects" class="nav-link">Projects</a>
                <a href="../index.html#contact" class="nav-link">Contact</a>
            </div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container" id="projectContent">
        <!-- Will be loaded from localStorage -->
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Jack Maguire. Showcasing my passion for coding and creation.</p>
            <div class="social-links">
                <a href="https://github.com/JMagDev1" target="_blank">GitHub</a>
                <a href="../index.html">Home</a>
            </div>
        </div>
    </footer>

    <script>
        // Get project ID from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');

        if (projectId) {
            // Load project from localStorage
            const customProjects = JSON.parse(localStorage.getItem('customProjects') || '[]');
            const project = customProjects[parseInt(projectId)];

            if (project && project.html) {
                // Insert the project HTML content
                const contentDiv = document.getElementById('projectContent');
                contentDiv.innerHTML = project.html;
            } else {
                document.getElementById('projectContent').innerHTML = `
                    <div style="text-align: center; padding: 3rem;">
                        <h2>Project not found</h2>
                        <p>The project you're looking for doesn't exist or has been deleted.</p>
                        <a href="ProjectsTable.html" style="color: var(--primary-color); text-decoration: none;">Back to Projects</a>
                    </div>
                `;
            }
        } else {
            document.getElementById('projectContent').innerHTML = `
                <div style="text-align: center; padding: 3rem;">
                    <h2>Invalid project reference</h2>
                    <p>Please go to the projects table to select a project.</p>
                    <a href="ProjectsTable.html" style="color: var(--primary-color); text-decoration: none;">Go to Projects</a>
                </div>
            `;
        }

        // Hamburger Menu Toggle
        const hamburger = document.querySelector('.hamburger');
        const navMenu = document.querySelector('.nav-menu');

        if (hamburger) {
            hamburger.addEventListener('click', () => {
                navMenu.classList.toggle('active');
                hamburger.classList.toggle('active');
            });
        }

        // Close menu when clicking on a link
        const navLinks = document.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                if (navMenu) navMenu.classList.remove('active');
                if (hamburger) hamburger.classList.remove('active');
            });
        });
    </script>
</body>
</html>
