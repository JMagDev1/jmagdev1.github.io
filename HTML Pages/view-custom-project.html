<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Project - Jack Maguire Portfolio</title>
    <link rel="stylesheet" href="../css/project-page.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../images/PicForBar.png">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="nav-logo">
                <span class="logo-symbol">&lt;/&gt;</span>
                <span>Jack Maguire</span>
            </a>
            <div class="nav-menu">
                <a href="../index.html#home" class="nav-link">Home</a>
                <a href="../index.html#about" class="nav-link">About</a>
                <a href="../index.html#projects" class="nav-link">Projects</a>
                <a href="../index.html#contact" class="nav-link">Contact</a>
            </div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container" id="projectContent" style="padding-top: 100px;">
        <!-- Will be loaded from localStorage -->
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Jack Maguire. Showcasing my passion for coding and creation.</p>
            <div class="social-links">
                <a href="https://github.com/JMagDev1" target="_blank">GitHub</a>
                <a href="../index.html">Home</a>
            </div>
        </div>
    </footer>

    <script src="project-page.js"></script>
    <script src="project-page-enhanced.js"></script>
    <script>
        // Get project ID from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');

        if (projectId) {
            // Load project from localStorage
            const customProjects = JSON.parse(localStorage.getItem('customProjects') || '[]');
            const project = customProjects[parseInt(projectId)];

            if (project) {
                const contentDiv = document.getElementById('projectContent');
                
                // Insert project content
                contentDiv.innerHTML = `
                    <section class="project-content">
                        <div class="container">
                            <div class="content-grid">
                                <div class="main-content" data-custom-project="${projectId}">
                                    <h1>${project.name || 'Custom Project'}</h1>
                                    
                                    <!-- Image Carousel -->
                                    <div class="image-carousel">
                                        <div class="carousel-container"></div>
                                        <div class="carousel-controls"></div>
                                        <div class="carousel-info">Loading images...</div>
                                    </div>

                                    <!-- Project Actions -->
                                    <div class="project-actions">
                                        <button class="btn btn-delete">🗑️ Delete Project</button>
                                        <a href="ProjectsTable.html" class="btn btn-primary">← Back to Projects</a>
                                    </div>

                                    <div class="project-meta">
                                        <div class="meta-item">
                                            <span class="label">Year:</span>
                                            <span>${project.year || 'N/A'}</span>
                                        </div>
                                        <div class="meta-item">
                                            <span class="label">Type:</span>
                                            <span class="badge">${project.type || 'N/A'}</span>
                                        </div>
                                        <div class="meta-item">
                                            <span class="label">Technology:</span>
                                            <span>${project.language || 'N/A'}</span>
                                        </div>
                                        <div class="meta-item">
                                            <span class="label">Status:</span>
                                            <span class="status ${(project.status || 'Completed').toLowerCase()}">${project.status || 'Completed'}</span>
                                        </div>
                                    </div>

                                    <section class="description-section">
                                        <h2>About This Project</h2>
                                        <p>${project.description || 'No description available'}</p>
                                    </section>

                                    ${project.challenges ? `
                                        <section class="challenges-section">
                                            <h2>Challenges & Solutions</h2>
                                            <p>${project.challenges}</p>
                                        </section>
                                    ` : ''}

                                    ${project.learnings ? `
                                        <section class="learnings-section">
                                            <h2>What I Learned</h2>
                                            <p>${project.learnings}</p>
                                        </section>
                                    ` : ''}
                                </div>

                                <aside class="sidebar">
                                    <div class="sidebar-card">
                                        <h3>Navigation</h3>
                                        <a href="ProjectsTable.html" class="sidebar-link">Back to All Projects</a>
                                        <a href="../index.html" class="sidebar-link">Home</a>
                                    </div>

                                    <div class="sidebar-card">
                                        <h3>Project Details</h3>
                                        <div class="details-list">
                                            <div class="detail-item">
                                                <span class="detail-label">Type:</span>
                                                <span>${project.type || 'N/A'}</span>
                                            </div>
                                            <div class="detail-item">
                                                <span class="detail-label">Year:</span>
                                                <span>${project.year || 'N/A'}</span>
                                            </div>
                                            <div class="detail-item">
                                                <span class="detail-label">Tech Stack:</span>
                                                <span>${project.language || 'N/A'}</span>
                                            </div>
                                            <div class="detail-item">
                                                <span class="detail-label">Status:</span>
                                                <span class="status ${(project.status || 'Completed').toLowerCase()}">${project.status || 'Completed'}</span>
                                            </div>
                                        </div>
                                    </div>
                                </aside>
                            </div>
                        </div>
                    </section>
                `;

                // Initialize carousel with custom project images
                setTimeout(() => {
                    window.carousel = new ProjectCarousel();
                    window.editor = new ProjectEditor();
                    populateCarousel();
                }, 100);
            } else {
                document.getElementById('projectContent').innerHTML = `
                    <div style="text-align: center; padding: 3rem;">
                        <h2>Project not found</h2>
                        <p>The project you're looking for doesn't exist or has been deleted.</p>
                        <a href="ProjectsTable.html" style="color: var(--primary-color); text-decoration: none;">Back to Projects</a>
                    </div>
                `;
            }
        } else {
            document.getElementById('projectContent').innerHTML = `
                <div style="text-align: center; padding: 3rem;">
                    <h2>Invalid project reference</h2>
                    <p>Please go to the projects table to select a project.</p>
                    <a href="ProjectsTable.html" style="color: var(--primary-color); text-decoration: none;">Go to Projects</a>
                </div>
            `;
        }
    </script>
</body>
</html>
